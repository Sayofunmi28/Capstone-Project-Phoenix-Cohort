apiVersion: v1
kind: ConfigMap
metadata:
  name: taskapp-config
  namespace: taskapp
data:
  ENVIRONMENT: "production"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "taskapp"

  # Change these if your application uses different ports.
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "3000"