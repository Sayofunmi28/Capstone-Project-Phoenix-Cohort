apiVersion: batch/v1
kind: Job
metadata:
  name: taskapp-migration
  namespace: taskapp
  labels:
    app.kubernetes.io/name: taskapp-migration
    app.kubernetes.io/part-of: taskapp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskapp-migration
        app.kubernetes.io/part-of: taskapp

    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc

          command:
            - alembic
            - upgrade
            - head

          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: taskapp-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskapp-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"