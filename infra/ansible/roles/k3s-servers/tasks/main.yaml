- name: Install required packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install k3s server
  become: true
  ansible.builtin.shell:
    cmd: |
      curl -sfL {{ k3s_install_url }} | \
        INSTALL_K3S_VERSION="{{ k3s_version }}" \
        INSTALL_K3S_EXEC="server --node-ip {{ k3s_server_ip }} --advertise-address {{ k3s_server_ip }}" \
        sh -
    creates: /usr/local/bin/k3s
  notify: Restart k3s

- name: Enable and start k3s
  become: true
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for k3s node token
  become: true
  ansible.builtin.wait_for:
    path: "{{ k3s_token_file }}"
    timeout: 120

- name: Read k3s node token
  become: true
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_token_raw
  no_log: true

- name: Store cluster token as a fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Wait for Kubernetes API
  become: true
  ansible.builtin.wait_for:
    host: "{{ k3s_server_ip }}"
    port: "{{ k3s_api_port }}"
    timeout: 120