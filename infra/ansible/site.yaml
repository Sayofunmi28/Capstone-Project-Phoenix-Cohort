- name: Test k3s cluster nodes
  hosts: k3s_cluster
  become: true

  tasks:
    - name: Verify connectivity
      ansible.builtin.ping:


- name: Install k3s server
  hosts: server
  become: true

  roles:
    - k3s-servers


- name: Install k3s agents
  hosts: workers
  become: true

  vars:
    k3s_server_ip: "{{ hostvars[groups['server'][0]].k3s_server_ip }}"
    k3s_node_token: "{{ hostvars[groups['server'][0]].k3s_node_token }}"

  roles:
    - k3s-agent


- name: Verify k3s cluster
  hosts: server
  become: true

  tasks:
    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: k3s_nodes
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        var: k3s_nodes.stdout
        
